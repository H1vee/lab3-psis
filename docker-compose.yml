name: lab3-psis

services:
  db:
    image: postgres:16-alpine
    container_name: lab3-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend
    restart: "no"

  api:
    build:
      context: ./api
      args:
        APP_VERSION: ${APP_VERSION}
    image: lab3-api:${APP_VERSION}
    container_name: lab3-api
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      API_ADDR: ":8080"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/teapot-api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - backend
      - frontend
    restart: "no"

  web:
    image: nginx:1.27-alpine
    container_name: lab3-web
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./web/site:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    restart: "no"

  adminer:
    image: adminer:4
    container_name: lab3-adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    restart: "no"

volumes:
  pgdata:

networks:
  frontend:
  backend:
    internal: true
